name: Build Qissati APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK/cmdline-tools/16.0/bin/sdkmanager"; fi
          if [ ! -x "$SDKMANAGER" ]; then echo 'Android sdkmanager not installed'; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stage app web assets and launcher icon
        run: |
          mkdir -p src/main/assets src/main/res/drawable-nodpi
          for asset in icon.jpg hero.jpg garden.jpg magic.jpg sea.jpg forest.jpg space.jpg city.jpg qissati_icon.jpg scene_world.jpg scene_bird.jpg scene_friends.jpg scene_ocean.jpg scene_rainbow.jpg scene_reading.jpg; do
            test -s "$asset" || { echo "Missing required image: $asset"; exit 1; }
            cp "$asset" src/main/assets/
          done
          cp qissati_icon.jpg src/main/res/drawable-nodpi/qissati_launcher.jpg
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verify packaged images
        run: |
          APK=$(find build/outputs/apk/debug app/build/outputs/apk/debug -name '*.apk' -type f 2>/dev/null | head -n 1)
          test -n "$APK" || { echo 'APK not found'; exit 1; }
          unzip -Z1 "$APK" > /tmp/qissati-apk-files.txt
          grep -Eq '^res/drawable-nodpi(-v4)?/qissati_launcher.jpg$' /tmp/qissati-apk-files.txt || { echo 'Launcher icon missing'; exit 1; }
          for asset in index.html icon.jpg hero.jpg garden.jpg magic.jpg sea.jpg forest.jpg space.jpg city.jpg qissati_icon.jpg scene_world.jpg scene_bird.jpg scene_friends.jpg scene_ocean.jpg scene_rainbow.jpg scene_reading.jpg; do
            grep -Fx "assets/$asset" /tmp/qissati-apk-files.txt || { echo "Missing assets/$asset"; exit 1; }
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qissati-Bisoora-Debug-APK
          path: |
            build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
