name: Android QA - development

on:
  push:
    branches:
      - development/arabic-quality-reader
      - development/voice-fusha-conversion
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript syntax
        run: node scripts/check-inline-js.cjs
      - name: Validate backend JavaScript syntax
        run: node --check backend/server.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stage web assets and launcher icon
        run: |
          mkdir -p src/main/assets src/main/res/drawable-nodpi
          for asset in icon.jpg hero.jpg garden.jpg magic.jpg sea.jpg forest.jpg space.jpg city.jpg scene_world.jpg scene_bird.jpg scene_friends.jpg scene_ocean.jpg scene_rainbow.jpg scene_reading.jpg qissati_icon.jpg qissati-start.jpg icon-192.png; do
            test -s "$asset" || { echo "Missing required image: $asset"; exit 1; }
            cp "$asset" src/main/assets/
          done
          cp qissati_icon.jpg src/main/res/drawable-nodpi/qissati_launcher.jpg
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify packaged story interface
        run: |
          APK="$(find build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          unzip -p "$APK" assets/index.html > /tmp/qissati-packaged-index.html
          cmp index.html /tmp/qissati-packaged-index.html
          grep -q 'convertRecordedTextToFusha' /tmp/qissati-packaged-index.html
          grep -q 'sendAiChatMessage' /tmp/qissati-packaged-index.html
      - name: Publish test APK
        uses: actions/upload-artifact@v4
        with:
          name: qissati-arabic-qa-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
