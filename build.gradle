plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'ps.khanyounis.qissati'
    compileSdk 35

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.exclude 'build/**', '.gradle/**', 'github/**', '.github/**'
            assets.srcDirs = ['.']
            assets.exclude '**/*.java', '**/*.gradle', '**/*.yml', '**/*.yaml', '**/*.md', '**/*.xml', '.github/**', 'github/**', 'build/**', '.gradle/**', '**/*.png~'
        }
    }

    defaultConfig {
        applicationId "ps.khanyounis.qissati"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "6.0-QuickGuide-HD-Fusha"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
