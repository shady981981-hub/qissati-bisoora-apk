plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'ps.khanyounis.qissati'
    compileSdk 35

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['.']
            java.exclude 'build/**', '.gradle/**', 'github/**', '.github/**'
            assets.srcDirs = ['src/main/assets']
        }
    }

    defaultConfig {
        applicationId "ps.khanyounis.qissati"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "7.0-Animated-Storybook"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

tasks.register('syncStoryWebAssets', Copy) {
    from('index.html')
    into(layout.buildDirectory.dir('generated/qissatiAssets'))
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/qissatiAssets'))
tasks.named('preBuild').configure { dependsOn('syncStoryWebAssets') }
